# Custom Survey Pipeline Configuration Template
#
# Schema:
#   [pipeline]
#     name            — human-readable label for this pipeline (required)
#     description     — what the pipeline does (required)
#
#   [generation]
#     entry_graph     — path to the .rcm entry-point file (required)
#     final_output    — filename the pipeline writes upon completion (required)
#     working_dir     — working directory relative to repo root (optional, default ".")
#     timeout_seconds — max wall-clock seconds for generation (optional, default 7200)
#     env             — list of env var names to forward from the host (optional, default [])
#
#   [output]
#     format          — output format: "markdown" | "json" (optional, default "markdown")
#     target_name     — filename to copy the final output to (optional, default "output.md")
#     copy_artifacts  — if true, copy all run artifacts (optional, default false)

[pipeline]
name = "Custom Pipeline"
description = "Template for custom survey generation pipelines"

[generation]
# REQUIRED: path to the RCM graph entry point (.rcm file)
entry_graph = "path/to/your_pipeline.rcm"

# REQUIRED: name of the final survey output file the pipeline produces
final_output = "07_survey.md"

# OPTIONAL: working directory (defaults to project root)
working_dir = "."

# OPTIONAL: max generation time in seconds (default 7200 = 2h)
timeout_seconds = 7200

# OPTIONAL: env vars the pipeline needs (passed from host environment)
env = ["DEEPSEEK_API_KEY"]

[output]
# OPTIONAL: output format (default "markdown")
format = "markdown"

# OPTIONAL: name to save generated surveys as (default "output.md")
target_name = "output.md"

# OPTIONAL: copy all run artifacts (default false; only copy final_output when false)
copy_artifacts = false
