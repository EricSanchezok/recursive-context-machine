[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "rcm-server"
path = "src/main.rs"

[dependencies]
tonic = "0.14"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
machine = { version = "0.1.0", path = "../machine" }
accelerator = { version = "0.1.0", path = "../accelerator" }
storage = { version = "0.1.0", path = "../storage" }
utils = { version = "0.1.0", path = "../utils" }
serde_json = "1"

[build-dependencies]
tonic-build = "0.13"

[package.metadata.cargo-machete]
ignored = ["prost", "tonic-build"]

[dev-dependencies]
tempfile = "3"
