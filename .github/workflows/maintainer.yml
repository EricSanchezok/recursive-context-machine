name: Maintainer

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

# Each issue / PR gets its own lane; superseded runs are cancelled so a rapid
# series of PR pushes only triggers one review at the end. Schedule and manual
# triggers fall back to run_id so they never cancel each other.
concurrency:
  group: maintainer-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  maintain:
    name: dispatch + run
    # Comment-triggered runs only proceed for human @maintainer mentions. The
    # dispatch.toml filter is the second line of defense; gating here avoids
    # spinning up a runner just to no-op on every chatty issue thread.
    if: |
      (
        github.event_name != 'issue_comment' &&
        github.event_name != 'pull_request_review_comment'
      ) ||
      (
        contains(github.event.comment.body, '@maintainer') &&
        github.event.comment.user.type != 'Bot' &&
        github.actor != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the code_change path can branch off main cleanly.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rcm-ci

      - name: Build accelerate
        run: cargo build --release --bin accelerate --locked

      - name: Configure git identity for code_change commits
        # Only the CI shell sets repo-level git config — the agent's `git` tool
        # rejects `git config` per AGENTS.md, so identity must be in place
        # before the agent runs.
        run: |
          git config user.email "287349951+Goblin-d@users.noreply.github.com"
          git config user.name "Goblin-d"

      - name: Render template for current event
        id: dispatch
        run: |
          ACTION=$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")
          RENDERED=$(./target/release/accelerate dispatch \
            --config examples/project-maintainer/dispatch.toml \
            --event-name "$GITHUB_EVENT_NAME" \
            --action "$ACTION" \
            --event-path "$GITHUB_EVENT_PATH" \
            --verbose)
          if [ -z "$RENDERED" ]; then
            echo "no route matched event=$GITHUB_EVENT_NAME action=$ACTION; skipping"
          else
            echo "rendered=$RENDERED" >> "$GITHUB_OUTPUT"
            echo "Rendered: $RENDERED"
          fi

      - name: Run rendered pipeline
        if: steps.dispatch.outputs.rendered != ''
        run: ./target/release/accelerate run "${{ steps.dispatch.outputs.rendered }}" --stream

      - name: Upload rendered .rcm as audit artifact
        # Keep even on failure — a busted run is exactly when we need the rendered
        # pipeline to reproduce locally.
        if: always() && steps.dispatch.outputs.rendered != ''
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ github.event_name }}-${{ github.run_id }}
          path: examples/project-maintainer/.rcm-cache/
          retention-days: 30
