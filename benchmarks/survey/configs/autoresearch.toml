# AutoResearch Survey Pipeline Configuration
#
# Schema:
#   [pipeline]
#     name            — human-readable label for this pipeline
#     description     — what the pipeline does
#
#   [generation]
#     working_dir     — relative path from repo root to the RCM project directory
#     entry_graph     — path to the .rcm entry-point file (within working_dir)
#     final_output    — filename the pipeline writes upon completion
#     timeout_seconds — max wall-clock seconds for generation (integer)
#     env             — list of env var names to forward from the host
#
#   [output]
#     format          — output format: "markdown" | "json"
#     target_name     — filename to copy the final output to
#     copy_artifacts  — if true, copy all run artifacts; if false, only final_output

[pipeline]
name = "AutoResearch Survey"
description = "Coverage-guided evidence-constrained survey pipeline"

[generation]
working_dir = "examples/autoresearch-survey"
entry_graph = "rcm/autoresearch_survey.rcm"
final_output = "08_survey.md"
timeout_seconds = 7200
env = ["DEEPSEEK_API_KEY", "OPENAI_API_KEY"]

[output]
format = "markdown"
target_name = "output.md"
copy_artifacts = false
