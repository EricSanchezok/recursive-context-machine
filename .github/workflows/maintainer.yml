name: Maintainer

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

# Each issue / PR gets its own lane. A new push or comment on the same PR
# cancels the in-progress run so the review always runs against the latest
# code. Schedule and manual triggers fall back to run_id so they never cancel
# each other.
concurrency:
  group: maintainer-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  maintain:
    name: dispatch + run
    # Comment-triggered runs only proceed for human @maintainer mentions. The
    # dispatch.toml filter is the second line of defense; gating here avoids
    # spinning up a runner just to no-op on every chatty issue thread.
    if: |
      (
        github.event_name != 'issue_comment' &&
        github.event_name != 'pull_request_review_comment'
      ) ||
      (
        contains(github.event.comment.body, '@maintainer') &&
        github.event.comment.user.type != 'Bot' &&
        github.actor != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KIMI_CODING_API_KEY: ${{ secrets.KIMI_CODING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the code_change path can branch off main cleanly.
          fetch-depth: 0

      - name: Download accelerate from the latest release
        # Decouples maintainer runs from the current HEAD: every run uses the
        # last published, known-good binary. If main breaks the build the bot
        # keeps working off the previous tag until a new release lands.
        run: |
          gh release download \
            --pattern 'accelerate-x86_64-linux' \
            --output accelerate
          chmod +x accelerate

      - name: Configure git identity for code_change commits
        # Only the CI shell sets repo-level git config — the agent's `git` tool
        # rejects `git config` per AGENTS.md, so identity must be in place
        # before the agent runs.
        run: |
          git config user.email "287349951+Goblin-d@users.noreply.github.com"
          git config user.name "Goblin-d"

      - name: Render template for current event
        id: dispatch
        run: |
          ACTION=$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")
          RENDERED=$(./accelerate dispatch \
            --config examples/project-maintainer/dispatch.toml \
            --event-name "$GITHUB_EVENT_NAME" \
            --action "$ACTION" \
            --event-path "$GITHUB_EVENT_PATH" \
            --verbose)
          if [ -z "$RENDERED" ]; then
            echo "no route matched event=$GITHUB_EVENT_NAME action=$ACTION; skipping"
          else
            echo "rendered=$RENDERED" >> "$GITHUB_OUTPUT"
            echo "Rendered: $RENDERED"
          fi

      - name: Check out PR head for in-context review reads
        # pr_review's diff_review / intent_check read PR files via the fs tool, so
        # the working tree must hold the PR's code — not the base we rendered from.
        # Done AFTER rendering (templates + dispatch.toml come from base) and only
        # for pull_request events. Files are only read, never built or executed,
        # so PR code on disk is not run. The rendered .rcm lives in the gitignored
        # .rcm-cache/ and survives the branch switch. Internal/branch PRs only —
        # forks can't run this pipeline today (no secrets on fork pull_request).
        if: ${{ steps.dispatch.outputs.rendered != '' && github.event_name == 'pull_request' }}
        run: gh pr checkout ${{ github.event.pull_request.number }}

      - name: Run rendered pipeline
        if: steps.dispatch.outputs.rendered != ''
        run: ./accelerate run "${{ steps.dispatch.outputs.rendered }}" --stream

      - name: Upload rendered .rcm as audit artifact
        # Keep even on failure — a busted run is exactly when we need the rendered
        # pipeline to reproduce locally.
        if: always() && steps.dispatch.outputs.rendered != ''
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ github.event_name }}-${{ github.run_id }}
          path: examples/project-maintainer/.rcm-cache/
          retention-days: 30
