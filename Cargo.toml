[workspace]
members = ["crates/accelerator", "crates/machine", "crates/cli", "crates/utils"]
resolver = "3"

[workspace.dependencies]
rig = "0.36"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
