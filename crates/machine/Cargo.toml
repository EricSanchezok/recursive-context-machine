[package]
name = "machine"
version = "0.1.0"
edition = "2024"
description = "CM — Context Machine core primitives"

[dependencies]
tokio = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rig = { workspace = true }
tracing = "0.1"
chrono = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
