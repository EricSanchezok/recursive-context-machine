[package]
name = "machine"
version = "0.1.0"
edition = "2024"
description = "CM — Context Machine core primitives"

[dependencies]
utils = { path = "../utils" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rig-core = { version = "0.36", features = ["reqwest", "rustls"] }
http = "1"
tracing = { workspace = true }
base64 = "0.22"
futures-util = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
