name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: accelerate-x86_64-linux
            archive: accelerate-x86_64-linux.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: accelerate-aarch64-linux
            archive: accelerate-aarch64-linux.tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            name: accelerate-aarch64-darwin
            archive: accelerate-aarch64-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            name: accelerate-x86_64-darwin
            archive: accelerate-x86_64-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: accelerate-x86_64-windows
            archive: accelerate-x86_64-windows.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps (Linux aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --bin accelerate --target ${{ matrix.target }} --locked

      - name: Package (tar.gz)
        if: matrix.os != 'windows-latest'
        run: |
          tar czf "${{ matrix.archive }}" -C target/${{ matrix.target }}/release accelerate

      - name: Package (zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/accelerate.exe" -DestinationPath "${{ matrix.archive }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}

  publish:
    name: Publish to rcm-dist
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum * | tee checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: EricSanchezok/rcm-dist
          token: ${{ secrets.RCM_DIST_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dist/*
          generate_release_notes: true

      - name: Checkout rcm-dist for formula update
        uses: actions/checkout@v4
        with:
          repository: EricSanchezok/rcm-dist
          token: ${{ secrets.RCM_DIST_TOKEN }}
          path: rcm-dist

      - name: Compute SHA256 hashes for formula
        id: hashes
        working-directory: dist
        run: |
          echo "x86_64_linux=$(sha256sum accelerate-x86_64-linux.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "aarch64_linux=$(sha256sum accelerate-aarch64-linux.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "aarch64_darwin=$(sha256sum accelerate-aarch64-darwin.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "x86_64_darwin=$(sha256sum accelerate-x86_64-darwin.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        working-directory: rcm-dist
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TAG_CLEAN="${TAG#v}"

          HASH_X86_64_LINUX="${{ steps.hashes.outputs.x86_64_linux }}"
          HASH_AARCH64_LINUX="${{ steps.hashes.outputs.aarch64_linux }}"
          HASH_AARCH64_DARWIN="${{ steps.hashes.outputs.aarch64_darwin }}"
          HASH_X86_64_DARWIN="${{ steps.hashes.outputs.x86_64_darwin }}"

          sed -i "s/version \".*\"/version \"${TAG_CLEAN}\"/" Formula/rcm.rb
          sed -i "s/REPLACE_WITH_SHA256_FOR_v.*_x86_64_linux/${HASH_X86_64_LINUX}/" Formula/rcm.rb
          sed -i "s/REPLACE_WITH_SHA256_FOR_v.*_aarch64_linux/${HASH_AARCH64_LINUX}/" Formula/rcm.rb
          sed -i "s/REPLACE_WITH_SHA256_FOR_v.*_aarch64_darwin/${HASH_AARCH64_DARWIN}/" Formula/rcm.rb
          sed -i "s/REPLACE_WITH_SHA256_FOR_v.*_x86_64_darwin/${HASH_X86_64_DARWIN}/" Formula/rcm.rb

          cat Formula/rcm.rb

      - name: Commit and push formula update
        working-directory: rcm-dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rcm.rb
          git commit -m "Update formula for ${{ steps.tag.outputs.tag }}" || echo "No changes to commit"
          git push
