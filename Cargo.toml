[workspace]
members = ["crates/tool"]
resolver = "3"

[workspace.dependencies]
rig = "0.36"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "rica"
version = "0.1.0"
edition = "2024"

[dependencies]
rig = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }